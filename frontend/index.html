<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrajX — Visor Público Multi-Época y Multi-Banda SPHEREx (NASA)</title>
  
  <meta name="description" content="Visualizador multi-época y multi-banda de la misión espacial SPHEREx de la NASA. Análisis temporal en 102 bandas infrarrojas.">
  <meta name="theme-color" content="#003F5C">

  <!-- Open Graph -->
  <meta property="og:title" content="GrajX — Visor SPHEREx NASA">
  <meta property="og:description" content="Animador temporal de imágenes infrarrojas y huellas moleculares del telescopio espacial SPHEREx.">
  <meta property="og:type" content="website">

  <!-- Tipografía Profesional -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Estilos -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <a href="#main-content" class="sr-only sr-only-focusable">Saltar al visor de imágenes</a>

  <!-- Cabecera -->
  <header class="site-header" role="banner">
    <div class="header-container">
      <a href="." class="brand" aria-label="GrajX Inicio">
        <div class="brand-logo-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M12 2a10 10 0 0 1 10 10"></path>
            <path d="M12 22a10 10 0 0 1-10-10"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1>GrajX</h1>
          <span class="brand-badge">NASA SPHEREx</span>
        </div>
      </a>

      <div class="header-actions">
        <span class="header-subtext">
          Space Apps Challenge Hermosillo
        </span>
      </div>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="app-main" id="main-content" role="main">

    <!-- Buscador de coordenadas celestes y presets -->
    <section class="search-presets-section" id="search-presets-section" aria-label="Búsqueda y Objetos de Prueba"></section>

    <!-- Disposición de 2 Columnas -->
    <div class="workspace-grid">
      
      <!-- Visor Central (Blink Comparator) -->
      <section class="viewer-card" id="viewer-card" aria-label="Visor Temporal de Imágenes SPHEREx"></section>

      <!-- Panel Lateral (Metadatos, Espectro y Comparador) -->
      <aside class="inspector-card" aria-label="Información y Huella Espectral">
        <article class="info-box" id="info-box"></article>
        <article class="spectrum-card" id="spectrum-card"></article>
        <article class="comparison-card" id="comparison-card"></article>
      </aside>

    </div>

  </main>

  <!-- Pie de Página -->
  <footer class="site-footer" role="contentinfo">
    <p>
      GrajX — Misión SPHEREx NASA. Datos científicos provistos por NASA/IPAC Infrared Science Archive (IRSA).
    </p>
  </footer>

  <div id="modal-container"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
